name: Publish Skill Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Strict SemVer, Version Alignment & Provenance
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERROR: tag '$TAG' is not strict vX.Y.Z"; exit 1; }
          VER="${TAG#v}"
          MANIFEST=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          PACKAGE=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          [ "$MANIFEST" = "$VER" ] || { echo "ERROR: manifest.json version $MANIFEST != tag $VER"; exit 1; }
          [ "$PACKAGE" = "$VER" ] || { echo "ERROR: package.json version $PACKAGE != tag $VER"; exit 1; }
          grep -qF "## [$VER]" CHANGELOG.md || { echo "ERROR: CHANGELOG.md has no '## [$VER]' section"; exit 1; }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "ERROR: tagged commit $GITHUB_SHA is not on origin/main; refusing to release"; exit 1; }
          echo "Confirmed: $TAG matches manifest, package, CHANGELOG and is on main."

      - name: Run Test Suite
        shell: bash
        run: |
          python -m unittest tests/test_ledger_pilot.py tests/test_pack.py tests/test_access_probe.py tests/test_backend_transfer.py tests/test_sqlite_lifecycle.py tests/test_verification_guard.py tests/test_progress_view.py tests/test_package_and_update.py

      - name: Validate Packaging Dry-Run
        shell: bash
        run: |
          python tools/package.py --dry-run

      - name: Test Native POSIX Installer Dry-Run (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sh ./install.sh --dry-run
          node bin/install.js --dry-run

      - name: Test Native PowerShell Installer Dry-Run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -DryRun
          node bin/install.js --dry-run

  publish:
    name: Build & Publish GitHub Release
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Verified Release Archives & Checksums
        run: |
          python tools/package.py --output-dir dist

      - name: Extract Release Notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          python - "$VER" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(?P<body>.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          if not match:
              sys.exit(f"ERROR: CHANGELOG.md has no '## [{version}]' section")
          body = re.sub(r"\n-{3,}[ \t]*\n?\s*$", "", match.group("body")).strip()
          if not body:
              sys.exit(f"ERROR: the '## [{version}]' section is empty")
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf8", newline="\n")
          print(f"Extracted '## [{version}]' from CHANGELOG.md ({len(body)} chars)")
          PY
          test -s release-notes.md

      - name: Create GitHub Release with Verified Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/* \
            --title "Herdr Role Pack $TAG" \
            --notes-file release-notes.md \
            --verify-tag
